name: Deploy Backend to EC2

on:
  push:
    branches:
      - dev # This triggers the deploy whenever you push to the dev branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Load the full shell environment (NVM, Node, PM2)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            # 2. Navigate and Update
            cd ~/STDEP-back-end
            git pull origin dev

            # 3. Handle Python dependencies
            source venv/bin/activate
            pip install -r requirements.txt

            # 4. Restart the App
            pm2 restart stdep-backend || pm2 start "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000" --name "stdep-backend"
